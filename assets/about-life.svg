<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <style>
      600;700&family=JetBrains+Mono:wght@400;700&display=swap');
      .bg { fill: #090d16; rx: 16px; }
      .border { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 1px; }
      .card-bg { fill: #111827; stroke: rgba(255, 255, 255, 0.05); stroke-width: 1px; rx: 12px; }
      
      .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #10b981; }
      .desc { font-family: 'Inter', sans-serif; font-size: 13px; fill: #94a3b8; line-height: 1.5; }
    </style>
  </defs>

  <rect width="900" height="220" class="bg" />
  <rect width="898" height="218" x="1" y="1" class="border" rx="15" />

  <!-- Section Header -->
  <text x="40" y="42" class="mono">// 01. CORE PHILOSOPHY & INTERESTS</text>

  <!-- Card 1: Engineering -->
  <g transform="translate(40, 65)">
    <rect width="250" height="120" class="card-bg" />
    <text x="20" y="35" class="title">🚀 Engineering</text>
    <text x="20" y="65" class="desc">High-throughput microservices,</text>
    <text x="20" y="85" class="desc">distributed databases & LLMs.</text>
  </g>

  <!-- Card 2: Open Source -->
  <g transform="translate(325, 65)">
    <rect width="250" height="120" class="card-bg" />
    <text x="20" y="35" class="title">🌐 Open Source</text>
    <text x="20" y="65" class="desc">Active contributor to developer</text>
    <text x="20" y="85" class="desc">tools & Rust ecosystem.</text>
  </g>

  <!-- Card 3: Beyond Code -->
  <g transform="translate(610, 65)">
    <rect width="250" height="120" class="card-bg" />
    <text x="20" y="35" class="title">☕ Life & Focus</text>
    <text x="20" y="65" class="desc">Specialty coffee enthusiast,</text>
    <text x="20" y="85" class="desc">cyberpunk sci-fi & synthwave.</text>
  </g>
</svg>

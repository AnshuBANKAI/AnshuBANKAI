<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#451126" />
    </linearGradient>

    <!-- Animated Glow Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.2">
        <animate attributeName="offset" values="-1; 1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.8">
        <animate attributeName="offset" values="0; 2" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0.2">
        <animate attributeName="offset" values="1; 3" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#451126" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="320" fill="url(#bg-grad)" rx="12" />
  <rect width="1000" height="320" fill="url(#grid)" rx="12" />

  <!-- Animated Orbital Ring -->
  <circle cx="850" cy="160" r="90" fill="none" stroke="#701A3D" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 850 160" to="360 850 160" dur="20s" repeatCount="indefinite" />
  </circle>

  <!-- Title & Role -->
  <text x="60" y="130" fill="#F8F0F3" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="1">
    Anshu Sharma
  </text>
  
  <text x="60" y="175" fill="#E5B5C7" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="1.5">
    GEN AI |  FULL-STACK MERN DEVELOPER  
  </text>

  <!-- Glowing Underline Accent -->
  <path d="M 60 205 L 620 205" stroke="url(#glow-grad)" stroke-width="3" stroke-linecap="round" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Connect">
  <rect width="900" height="240" rx="22" fill="#070b16" />
  <rect x="1" y="1" width="898" height="238" rx="21" fill="none" stroke="#247bff" stroke-opacity=".6" stroke-width="2" />
  
  <text x="50" y="55" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#f4f6ff">Let's Connect</text>
  
  <!-- LinkedIn Button -->
  <rect x="50" y="85" width="245" height="55" rx="12" fill="#0f1830" stroke="#243049" />
  <circle cx="80" cy="112" r="16" fill="#0A66C2" />
  <text x="80" y="118" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">in</text>
  <text x="110" y="117" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f4f6ff">LinkedIn</text>

  <!-- YouTube Button -->
  <rect x="315" y="85" width="245" height="55" rx="12" fill="#0f1830" stroke="#243049" />
  <circle cx="345" cy="112" r="16" fill="#E02424" />
  <text x="345" y="118" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">▶</text>
  <text x="375" y="117" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f4f6ff">YouTube</text>

  <!-- Topmate Button -->
  <rect x="580" y="85" width="270" height="55" rx="12" fill="#0f1830" stroke="#243049" />
  <circle cx="610" cy="112" r="16" fill="#7C3AED" />
  <text x="610" y="118" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">📅</text>
  <text x="640" y="117" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f4f6ff">Topmate Booking</text>
</svg>

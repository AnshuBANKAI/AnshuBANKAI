<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <style>
      700;900&family=JetBrains+Mono:wght@400;700&display=swap');
      
      .bg { fill: #090d16; rx: 16px; }
      .border { fill: none; stroke: rgba(16, 185, 129, 0.25); stroke-width: 1.5px; }
      .grid { fill: none; stroke: rgba(255, 255, 255, 0.03); stroke-width: 1; }
      
      .mono-tag { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #10b981; letter-spacing: 1.5px; font-weight: 700; }
      .main-title { font-family: 'Inter', sans-serif; font-size: 42px; font-weight: 900; fill: #ffffff; letter-spacing: -1px; }
      .accent-text { fill: #10b981; }
      .sub-title { font-family: 'Inter', sans-serif; font-size: 16px; fill: #94a3b8; font-weight: 400; }
      
      .badge-bg { fill: rgba(16, 185, 129, 0.1); stroke: rgba(16, 185, 129, 0.3); stroke-width: 1px; rx: 20px; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #34d399; font-weight: 700; }
      
      .pulse-dot { fill: #10b981; animation: pulse 2s infinite; }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
    </style>
    
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" class="grid" />
    </pattern>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" class="bg" />
  <rect width="900" height="320" fill="url(#grid-pattern)" rx="16" />
  <rect width="898" height="318" x="1" y="1" class="border" rx="15" />

  <!-- Accent Glow -->
  <circle cx="800" cy="60" r="120" fill="#10b981" opacity="0.08" filter="blur(40px)" />

  <!-- Live Status Badge -->
  <g transform="translate(50, 45)">
    <rect width="180" height="32" class="badge-bg" />
    <circle cx="20" cy="16" r="4" class="pulse-dot" />
    <text x="34" y="20" class="badge-text">SYSTEM ONLINE // 2026</text>
  </g>

  <!-- Hero Headline -->
  <g transform="translate(50, 130)">
    <text class="mono-tag" x="0" y="0">> HELLO, WORLD! I AM</text>
    <text class="main-title" x="0" y="45">ALEX <tspan class="accent-text">DEV</tspan></text>
    <text class="sub-title" x="0" y="82">Full-Stack Architect & AI Systems Engineer</text>
  </g>

  <!-- Quick Info Pill Row -->
  <g transform="translate(50, 245)">
    <!-- Pill 1 -->
    <rect width="160" height="36" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" />
    <text x="15" y="23" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="12" fill="#e2e8f0">📍 Tokyo / Remote</text>
    
    <!-- Pill 2 -->
    <rect x="175" width="210" height="36" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" />
    <text x="190" y="23" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="12" fill="#e2e8f0">⚡ Building Autonomous Agents</text>
  </g>

  <!-- Decorative Abstract Graphics -->
  <g transform="translate(680, 80)">
    <rect width="160" height="160" rx="24" fill="none" stroke="url(#grad-accent)" stroke-width="2" stroke-dasharray="8 6" />
    <rect x="20" y="20" width="120" height="120" rx="16" fill="rgba(16, 185, 129, 0.05)" stroke="rgba(16, 185, 129, 0.2)" />
    <text x="80" y="75" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="28" font-weight="700" fill="#10b981" text-anchor="middle"></></text>
    <text x="80" y="105" font-family="&#39;Inter&#39;, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Code & Systems</text>
  </g>
</svg>



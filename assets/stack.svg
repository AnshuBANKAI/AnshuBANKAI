<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Tech stack">
  <rect width="900" height="320" rx="22" fill="#070b16" />
  <rect x="1" y="1" width="898" height="318" rx="21" fill="none" stroke="#247bff" stroke-opacity=".6" stroke-width="2" />
  
  <text x="50" y="65" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#f4f6ff">Tech Stack & Skills</text>
  
  <!-- Skill Badges -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#0f1830" stroke="#247bff" />
    <text x="55" y="23" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f4f6ff" text-anchor="middle">Python</text>

    <rect x="125" y="0" width="110" height="36" rx="18" fill="#0f1830" stroke="#ff354f" />
    <text x="180" y="23" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f4f6ff" text-anchor="middle">React</text>

    <rect x="250" y="0" width="120" height="36" rx="18" fill="#0f1830" stroke="#247bff" />
    <text x="310" y="23" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f4f6ff" text-anchor="middle">Node.js</text>

    <rect x="385" y="0" width="130" height="36" rx="18" fill="#0f1830" stroke="#ff354f" />
    <text x="450" y="23" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f4f6ff" text-anchor="middle">Express.js</text>

    <rect x="530" y="0" width="130" height="36" rx="18" fill="#0f1830" stroke="#247bff" />
    <text x="595" y="23" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f4f6ff" text-anchor="middle">MongoDB</text>
  </g>

  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#0f1830" stroke="#ff354f" />
    <text x="55" y="23" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f4f6ff" text-anchor="middle">Docker</text>

    <rect x="125" y="0" width="110" height="36" rx="18" fill="#0f1830" stroke="#247bff" />
    <text x="180" y="23" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f4f6ff" text-anchor="middle">Git</text>

    <rect x="250" y="0" width="140" height="36" rx="18" fill="#0f1830" stroke="#ff354f" />
    <text x="320" y="23" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f4f6ff" text-anchor="middle">PostgreSQL</text>

    <rect x="405" y="0" width="120" height="36" rx="18" fill="#0f1830" stroke="#247bff" />
    <text x="465" y="23" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f4f6ff" text-anchor="middle">TypeScript</text>
  </g>

  <text x="50" y="250" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#aab4cc">Full-stack web architectures, REST APIs, and machine learning workflows.</text>
</svg>
